<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق تفاعلي مطور</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">
<header class="bg-indigo-600 text-white shadow-md py-4 px-6">
<div class="max-w-4xl mx-auto flex justify-between items-center">
<h1 class="text-xl font-bold">لوحة التحكم الذكية</h1>
<span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">نسخة تفاعلية</span>
</div>
</header>
​<main class="max-w-4xl mx-auto p-6 flex-grow w-full">
<!-- Stats Section -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
<h3 class="text-slate-500 text-sm font-medium">إجمالي الطلبات</h3>
<p id="stat-orders" class="text-3xl font-bold text-indigo-600 mt-2">1,240</p>
</div>
<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
<h3 class="text-slate-500 text-sm font-medium">المستخدمون النشطون</h3>
<p id="stat-users" class="text-3xl font-bold text-emerald-600 mt-2">342</p>
</div>
<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
<h3 class="text-slate-500 text-sm font-medium">نسبة الأداء</h3>
<p id="stat-performance" class="text-3xl font-bold text-amber-600 mt-2">98.5%</p>
</div>
</div>
​<!-- Action Card -->
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 text-center">
<h2 class="text-2xl font-bold text-slate-800 mb-2">تحديث بيانات النظام</h2>
<p class="text-slate-600 mb-6">اضغط أدناه لمحاكاة جلب أحدث البيانات وتحديث الإحصائيات.</p>
​<button onclick="triggerAction()" id="action-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-8 rounded-lg transition inline-flex items-center">
<!-- Spinner (Initially Hidden) -->
<svg id="spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
</svg>
<span id="btn-text">تحديث البيانات الآن</span>
</button>
</div>
​<!-- Feedback Alert -->
<div id="output" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-lg text-center animate-bounce">
تم جلب وتحديث البيانات بنجاح!
</div>
</main>
​<footer class="bg-white border-t border-slate-200 py-4 px-6 text-center text-slate-500 text-sm">
جميع الحقوق محفوظة © 2026
</footer>
​<script>
function triggerAction() {
const btn = document.getElementById('action-btn');
const btnText = document.getElementById('btn-text');
const spinner = document.getElementById('spinner');
const output = document.getElementById('output');
​// Reset state
output.classList.add('hidden');
btn.disabled = true;
btn.classList.add('opacity-75');
spinner.classList.remove('hidden');
btnText.innerText = "جاري المعالجة...";
​// Simulate network delay
setTimeout(() => {
// Update stats with random numbers
document.getElementById('stat-orders').innerText = (Math.floor(Math.random() * 500) + 1000).toLocaleString();
document.getElementById('stat-users').innerText = Math.floor(Math.random() * 200) + 300;
document.getElementById('stat-performance').innerText = (90 + Math.random() * 9).toFixed(1) + '%';
​// Restore button and show success
spinner.classList.add('hidden');
btn.classList.remove('opacity-75');
btn.disabled = false;
btnText.innerText = "تحديث البيانات الآن";
output.classList.remove('hidden');
}, 1500);
}
</script>
</body>
</html>
