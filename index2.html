<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>يوميات عيلة محمد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF7A59;
            --secondary: #FFB84C;
            --bg-warm: #FFF8EE;
            --card-bg: #FFFFFF;
            --text-dark: #2D3142;
            --accent-blue: #4EA8DE;
            --accent-green: #52B788;
            --accent-pink: #F72585;
            --accent-purple: #7209B7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FFECD2 0%, #FCB69F 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-warm);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 5px solid #FFFFFF;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        /* شاشة البداية */
        .splash-screen {
            padding: 30px 20px;
            text-align: center;
            background: radial-gradient(circle at top, #FFF3E0, #FFE0B2);
        }

        .app-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            border-radius: 28px;
            border: 4px solid #FFF;
            box-shadow: 0 8px 20px rgba(255, 122, 89, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            position: relative;
        }

        .app-icon::after {
            content: "🏠";
            position: absolute;
            bottom: -8px;
            right: -8px;
            font-size: 28px;
            background: #FFF;
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 2px 2px 0px #FFF;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #5C6274;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .living-room-scene {
            background: #FFF;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            border: 3px dashed var(--secondary);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .char-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }

        .char-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 4px;
            border: 3px solid #FFF;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

            background: linear-gradient(180deg, #FF8C69 0%, #FF6B4A 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 900;
