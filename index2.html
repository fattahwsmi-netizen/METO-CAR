<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المستشفى الذكي</title>
    <style>
        :root {
            --primary-color: #0f4c81;
            --secondary-color: #17a2b8;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            background-color: var(--secondary-color);
            color: var(--white);
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            width: 100%;
        }
        .btn:hover {
            background-color: #138496;
        }
        footer {
            background-color: #333;
            color: var(--white);
            text-align: center;
            padding: 10px;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

<header>
    <h1>مستشفى العناية بالصحة</h1>
</header>

<div class="container">
    <!-- واجهة الاستقبال -->
    <div class="card">
        <h2>لوحة تحكم الاستقبال</h2>
        <p>مرحباً بك، يمكنك إدارة طوابير الانتظار وتسجيل الحالات الطارئة من هنا.</p>
        <button class="btn" onclick="document.getElementById('registration-section').scrollIntoView();">انتقل لتسجيل مريض جديد</button>
    </div>

    <!-- نموذج تسجيل المرضى -->
    <div class="card" id="registration-section">
        <h2>تسجيل مريض جديد</h2>
        <form>
            <div class="form-group">
                <label for="full-name">الاسم الكامل:</label>
                <input type="text" id="full-name" required>
            </div>
            <div class="form-group">
                <label for="dob">تاريخ الميلاد:</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="text" id="phone" required>
            </div>
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label for="medical-history">التاريخ الطبي:</label>
                <textarea id="medical-history" rows="3" placeholder="الأمراض المزمنة، الحساسية..."></textarea>
            </div>
            <div class="form-group">
                <label for="appointment-type">نوع الموعد:</label>
                <select id="appointment-type">
                    <option value="consultation">استشارة</option>
                    <option value="follow-up">متابعة</option>
                    <option value="emergency">طوارئ</option>
                </select>
            </div>
            <button type="submit" class="btn">تأكيد التسجيل</button>
        </form>
    </div>
</div>

<footer>
    حقوق الملكية الفكرية محفوظة © م/ محمد عبد الفتاح محمد
</footer>

</body>
</html>
