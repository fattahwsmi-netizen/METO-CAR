.seg,.tabs{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.seg button,.tabs button{background:none;border:0;color:#fff;font:inherit;font-size:14px;padding:3px 12px;border-radius:8px;cursor:pointer}
.seg .on,.tabs .on{background:var(--acc);color:var(--oa);font-weight:700}
.hero{background:var(--hero);color:#fff;position:relative;padding:20px 16px 44px}

.cta{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}

main{max-width:1040px;margin:auto;padding:20px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.car{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}

.st{font-weight:700;font-size:14px}.st:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-inline-end:6px}
.g{color:var(--ok)}.r{color:var(--bad)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.mut{color:var(--mut);font-size:14px}
.btn{background:var(--acc);color:var(--oa);border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd);padding:3px 10px;font-weight:400;font-size:14px}
.btn.d{color:var(--bad);border-color:var(--bad)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);min-width:0;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1 1 130px}.row>.btn{flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.stats b{display:block;font-size:26px}
h2{font-size:20px;margin:24px 0 10px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fr img{width:48px;height:36px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-inline-end:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.wm{font-weight:800;font-size:15px;letter-spacing:.35em;color:var(--acc);margin-bottom:6px}
.num{direction:ltr;unicode-bidi:isolate;font-weight:700}
.fo{max-width:1040px;margin:auto;padding:16px;border-top:1px solid var(--bd);color:var(--mut);font-size:14px;display:grid;gap:4px}
.lb{display:grid;gap:2px;font-size:13px;color:var(--mut)}
.wb{background:var(--card);border:1.5px solid var(--acc);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.modal.show{display:flex}.modal .card{width:100%;max-width:400px}.modal input{margin:6px 0}
</style>
</head>
